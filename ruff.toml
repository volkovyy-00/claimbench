# Ruff lint settings. `ruff check .` locally runs exactly what CI runs.
target-version = "py310"

[lint]
# Only the classic error rules (syntax errors, undefined names, unused
# imports/variables). Ruff's broader default set reported 91 findings on
# first run (2026-09-23), most needing a judgement call rather than a
# mechanical fix. Widen with `extend-select` once that backlog is cleared
# (follow-up ticket to EV-3). `ruff format` is not enforced yet for the same
# reason: it would reformat 19 files, including LLM prompt strings.
select = ["E4", "E7", "E9", "F"]
