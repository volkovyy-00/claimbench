# SonarCloud analysis, run by .github/workflows/sonarcloud.yml.
sonar.projectKey=<FILL_FROM_CONSOLE>
sonar.organization=<FILL_FROM_CONSOLE>

# The pipeline modules sit at the repo root; tests/ is analysed as test code.
sonar.sources=.
sonar.inclusions=*.py
sonar.tests=tests
sonar.python.version=3.10, 3.11, 3.12, 3.13

# Written by the "Run tests with coverage" step in the same workflow.
sonar.python.coverage.reportPaths=coverage.xml

# Make the scan step fail (and so block the PR) when the quality gate fails.
sonar.qualitygate.wait=true
